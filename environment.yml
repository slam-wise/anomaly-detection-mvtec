name: anomaly-det
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13

  # ── Scientific stack ───────────────────────────────────────────────────────
  - numpy>=2.1
  - scipy>=1.14          # Gaussian smoothing for anomaly maps
  - scikit-learn>=1.5    # AUROC, ROC curve
  - scikit-image>=0.24   # Morphological ops, image metrics

  # ── Image I/O & visualisation ──────────────────────────────────────────────
  # Pillow is installed via pip below — keeps it runtime-compatible with
  # pip-installed torchvision on Windows (avoids DLL mismatch).
  - matplotlib>=3.9
  - pandas>=2.2          # Results tables / CSV export

  # ── Utilities ──────────────────────────────────────────────────────────────
  - tqdm>=4.66
  - pyyaml>=6.0
  - einops>=0.8          # Clean tensor reshaping for patch extraction

  # ── Notebook support ───────────────────────────────────────────────────────
  - jupyter>=1.0
  - ipykernel>=6.29
  - ipywidgets>=8.0

  # ── Dev / testing / linting ────────────────────────────────────────────────
  - pytest>=8.0
  - pytest-cov>=5.0
  - black>=24.0
  - ruff>=0.6
  - isort>=5.13

  # ── PyTorch + faiss + Pillow via pip ──────────────────────────────────────
  # --extra-index-url adds the PyTorch WHL index alongside PyPI (not replacing
  # it), so faiss-cpu and Pillow resolve from PyPI while torch/torchvision
  # come from the WHL index. Torch/torchvision pinned to exact CUDA build
  # strings to prevent pip grabbing the CPU-only builds from PyPI instead.
  # To switch CUDA version, update the index URL and the +cuXXX suffixes:
  #   CUDA 12.4  →  cu124   CUDA 11.8  →  cu118   CPU only  →  cpu (drop +cuXXX)
  - pip>=24.0
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.11.0+cu128
    - torchvision==0.26.0+cu128
    - faiss-cpu>=1.9
    - Pillow>=11.0